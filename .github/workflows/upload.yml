name: Upload to AI Arena

on:
  push:
    branches: [main]

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create ladder zip
        run: python create_ladder_zip.py

      - name: Upload to AI Arena
        # Requires repository secrets: AIARENA_API_TOKEN and AIARENA_BOT_ID
        # Enable by setting AutoUploadToAiarena: True in config.yml
        if: ${{ vars.AUTO_UPLOAD == 'true' }}
        run: |
          curl -X PATCH \
            -H "Authorization: Token ${{ secrets.AIARENA_API_TOKEN }}" \
            -F "bot_zip=@bot.zip" \
            "https://aiarena.net/api/bots/${{ secrets.AIARENA_BOT_ID }}/"
